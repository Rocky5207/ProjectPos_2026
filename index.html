*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Helvetica Neue",Arial,sans-serif}
header{background:var(--green);color:#fff;display:flex;align-items:center;gap:42px;padding:0 max(4vw,20px);min-height:76px}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ca8a25;outline-offset:3px}

nav button{color:#e3e8df;background:none;border:0;padding:0 17px;border-bottom:3px solid transparent}

.brand b{font:600 24px/1 Georgia,serif;white-space:nowrap}
.brand small,.kicker,.register-id,.eyebrow,th{font:600 10px/1.4 'Courier New',monospace;letter-spacing:.12em}
.brand small{display:block;color:#d8e3d8;margin-top:5px}
.mark{font:italic bold 30px Georgia;border:1px solid #d6deca;border-radius:50%;width:43px;height:43px;display:grid;place-items:center}
.register-id{margin-left:auto;white-space:nowrap}
.mast{display:flex;align-items:end;justify-content:space-between;margin:33px 0 24px}
.kicker,.eyebrow{color:var(--muted);text-transform:uppercase}
.kicker{letter-spacing:.16em}
.date{font:13px 'Courier New',monospace;color:var(--muted);margin-bottom:7px}
main{max-width:1500px;margin:auto;padding:0 max(4vw,20px) 45px}
h1,h2,h3,p{margin:0}
h1{font:normal clamp(37px,4.5vw,64px)/1.05 Georgia,serif;letter-spacing:-.055em;margin-top:5px}
h2{font:normal 26px/1.15 Georgia,serif;letter-spacing:-.04em}
h3{font-size:15px}

.panel,.till{border:1px solid var(--line);background:#fdfcf7}

.till{padding:21px;border-top:4px solid var(--green)}
.heading,.row,.actions,.filters,.kpis,.meta{display:flex;align-items:center;gap:9px}

.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.tile img{width:100%;aspect-ratio:1.65;object-fit:cover;display:block}

.empty{color:var(--muted);padding:20px 0;font-size:14px}

.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{border-top:1px solid var(--ink);margin-top:14px;padding:10px 0}

.pay{display:block;width:100%;margin:10px 0}

.park button{margin:3px}
.tabular{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
th,td{text-align:left;border-bottom:1px solid #d9dacf;padding:9px 8px}
th{color:var(--muted)}
td.right{text-align:right}
.pill{color:var(--warm);font-size:12px;font-weight:bold}
.kpis{gap:0;margin:18px 0;border-block:1px solid var(--line);flex-wrap:wrap}
.metric{flex:1;padding:15px 12px;min-width:115px}
.metric b{display:block;font:normal 28px Georgia}
.metric span{color:var(--muted);font-size:12px}
.field{display:grid;gap:4px;margin:12px 0;font-size:13px}
.sub{margin-top:23px}
.actions{margin-top:14px;flex-wrap:wrap}
dialog{border:1px solid var(--line);color:var(--ink);padding:24px;background:#fffcf3;width:min(450px,94vw);max-height:90vh}
dialog::backdrop{background:#17231985}
#paper .eyebrow{margin-bottom:6px}
#paper table{font-size:12px}
button:disabled{opacity:.48;cursor:not-allowed}
.listbtn{display:block;text-align:left;background:none;border:0;text-decoration:underline;text-underline-offset:3px;font:inherit;color:var(--green);padding:0}
.legend{margin-top:13px}
.entry{margin:11px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
@media(max-width:900px){header{gap:12px}
nav button{padding:0 10px}
.columns{grid-template-columns:minmax(0,1.35fr) minmax(265px,1fr)}

nav button{min-height:42px;flex:1}
.columns{grid-template-columns:1fr}
.mast{margin-top:22px}
.date{font-size:10px}
.panel,.till{padding:14px}
.products{grid-template-columns:repeat(2,1fr)}
main{padding-inline:14px}
.register-id{margin-left:auto}
}
@media print{body>*:not(dialog){display:none}
dialog[open]{position:static;width:100%;border:none;max-height:none}
dialog .actions{display:none}

<main><div class="mast"><div><div class="kicker" id="section-id"></div><h1 id="title"></h1></div><div class="date" id="date"></div></div><div id="notice" role="status" aria-live="polite"></div><div id="app">Opening register…</div></main>

<script>'use strict';
// All monetary values are integer fen. Business dates use the counter's local clock.
const PRODUCTS = [
  {id:'101', art:'rice', name:'Seaweed rice ball', group:'Fresh', price:800, min:5},
  {id:'102', art:'sandwich', name:'Egg sandwich', group:'Fresh', price:950, min:4},
  {id:'103', art:'yogurt', name:'Peach yogurt', group:'Chilled', price:650, min:4},
  {id:'104', art:'soy', name:'Plain soy milk', group:'Drinks', price:350, min:5},
  {id:'105', art:'water', name:'Spring water', group:'Drinks', price:200, min:6},
  {id:'106', art:'crackers', name:'Sea salt crackers', group:'Pantry', price:500, min:4}
];
const product = id => {
  const found = PRODUCTS.find(p => p.id === id);
  if (!found) throw Error('Unknown product code.');
  return found;
};
function dayOf(date = new Date()) {
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')].join('-');
}
function offsetDay(day, offset) {
  const date = new Date(day+'T12:00:00');
  date.setDate(date.getDate()+offset);
  return dayOf(date);
}
function positive(n) {
  if (!Number.isSafeInteger(n) || n<1 || n>9999) throw Error('Enter a whole quantity from 1 to 9999.');
  return n;
}
function initialState(day) {
  const stocks = [['101',0,3],['101',2,6],['102',0,2],['102',2,5],['103',4,8],
    ['104',6,9],['105',90,12],['106',45,3]];
  const lots = stocks.map(([sku,offset,qty],i)=>({id:'B'+String(i+1).padStart(2,'0'),
    sku,expires:offsetDay(day,offset),qty,blocked:0}));
  return {version:0,lots,basket:{},holds:[],sales:[],refunds:[],moves:[],nextHold:1};
}
class StockBook {
  constructor(state, day) { this.state=state; this.day=day; }
  shelf(sku) {
    return this.state.lots.filter(l=>l.sku===sku && l.qty>0 && l.expires>=this.day)
      .sort((a,b)=>a.expires.localeCompare(b.expires)||a.id.localeCompare(b.id));
  }
  price(lot) {
    const p=product(lot.sku);
    return lot.expires===this.day && ['Fresh','Chilled'].includes(p.group)
      ? Math.round(p.price*0.75) : p.price;
  }
  allocate(sku, count) {
    let left=positive(count);
    const lines=[];
    for (const lot of this.shelf(sku)) {
      const qty=Math.min(left,lot.qty);
      lines.push({sku,lot:lot.id,qty,unit:this.price(lot),original:product(sku).price,returned:0});
      left-=qty;
      if (!left) break;
    }
    if(left) throw Error('Only '+(count-left)+' available for '+product(sku).name+'.');
    return lines;
  }
  move(lot, delta, isolated, reason, ref) {
    lot.qty+=delta; lot.blocked+=isolated;
    this.state.moves.push({day:this.day,lot:lot.id,sku:lot.sku,delta,isolated,reason,ref});
  }
}
class Register {
  constructor(state, day=dayOf()) { this.s=state; this.day=day; this.stock=new StockBook(state,day); }
  setQty(sku,qty) {
    product(sku);
    if (qty===0) { delete this.s.basket[sku]; return; }
    this.stock.allocate(sku,qty);
    this.s.basket[sku]=qty;
  }
  quote(basket=this.s.basket) {
    const lines=Object.entries(basket).flatMap(([sku,n])=>this.stock.allocate(sku,n));
    const total=lines.reduce((v,l)=>v+l.unit*l.qty,0);
    const saving=lines.reduce((v,l)=>v+(l.original-l.unit)*l.qty,0);
    return {lines,total,saving};
  }
  park() {
    if(!Object.keys(this.s.basket).length) throw Error('Add an item before parking a basket.');
    const id='H'+String(this.s.nextHold++).padStart(3,'0');
    const quoted=this.quote().total;
    this.s.holds.push({id,basket:this.s.basket,quoted}); this.s.basket={};
    return id;
  }
  recall(id) {
    if(Object.keys(this.s.basket).length) throw Error('Park or finish the current basket first.');
    const i=this.s.holds.findIndex(h=>h.id===id);
    if(i<0) throw Error('Ticket has already been recalled.');
    const ticket=this.s.holds.splice(i,1)[0];
    this.s.basket=ticket.basket;
    return ticket.quoted;
  }
  pay(cash) {
    const quote=this.quote();
    if(!quote.lines.length) throw Error('The basket is empty.');
    if(!Number.isSafeInteger(cash)||cash<quote.total) throw Error('Cash received is below the amount due.');
    const id='S'+String(this.s.sales.length+1).padStart(4,'0');
    const sale={id,day:this.day,...quote,cash,change:cash-quote.total};
    for(const l of sale.lines) this.stock.move(this.s.lots.find(b=>b.id===l.lot),-l.qty,0,'Sale',id);
    this.s.sales.push(sale); this.s.basket={}; return sale;
  }
  refund(id,index,qty,condition) {
    const sale=this.s.sales.find(x=>x.id===id);
    const line=sale?.lines[index];
    if(!line) throw Error('Select an original receipt line.');
    positive(qty);
    if(qty>line.qty-line.returned) throw Error('Return exceeds the quantity left on this line.');
    if(!['Sealed','Opened'].includes(condition)) throw Error('Choose a condition.');
    const lot=this.s.lots.find(b=>b.id===line.lot);
    const sellable=condition==='Sealed' && lot.expires>=this.day;
    const refund={id:'R'+String(this.s.refunds.length+1).padStart(4,'0'),sale:id,index,
      sku:line.sku,lot:lot.id,day:this.day,qty,amount:line.unit*qty,condition,
      route:sellable?'Shelf':'Quarantine'};
    line.returned+=qty;
    this.stock.move(lot,sellable?qty:0,sellable?0:qty,refund.route,refund.id);
    this.s.refunds.push(refund); return refund;
  }
  receive(sku,qty,expires) {
    product(sku); positive(qty);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(expires)||offsetDay(expires,0)!==expires||expires<this.day)
      throw Error('Use today or a later valid expiry date.');
    const lot={id:'B'+String(this.s.lots.length+1).padStart(2,'0'),sku,expires,qty:0,blocked:0};
    this.s.lots.push(lot); this.stock.move(lot,qty,0,'Delivery',lot.id);
    return lot.id;
  }
  shift() {
    const sales=this.s.sales.filter(s=>s.day===this.day);
    const refunds=this.s.refunds.filter(r=>r.day===this.day);
    const sum=(rows,field)=>rows.reduce((v,r)=>v+r[field],0);
    const gross=sum(sales,'total'), paidBack=sum(refunds,'amount');
    return {sales:sales.length,gross,paidBack,net:gross-paidBack,saving:sum(sales,'saving'),
      markedUnits:sales.flatMap(s=>s.lines).reduce((n,l)=>n+(l.unit<l.original?l.qty:0),0)};
  }
}
if(typeof module!=='undefined') module.exports={Register,StockBook,initialState,dayOf,offsetDay};
</script><script>class Store {
  async open() {
    this.db=await new Promise((resolve,reject)=>{
      const req=indexedDB.open('noon-counter-v1',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('counter');
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    });
    return this.run();
  }
  run(change,version) {
    return new Promise((resolve,reject)=>{
      const tx=this.db.transaction('counter','readwrite');
      const store=tx.objectStore('counter');
      const read=store.get('single-till');
      let state,result,problem;
      read.onsuccess=()=>{
        try {
          state=read.result||initialState(dayOf());
          if(change) {
            if(state.version!==version) throw Error('This counter changed in another tab. Review and retry.');
            result=change(new Register(state)); state.version++;
          }
          if(change||!read.result) store.put(state,'single-till');
        } catch(e) { problem=e; tx.abort(); }
      };
      tx.oncomplete=()=>resolve({state,result});
      tx.onabort=()=>reject(problem||tx.error||Error('Storage is unavailable.'));
      tx.onerror=()=>{};
    });
  }
}

const sections={Register:'Lunch counter',Returns:'Receipt & returns',Stock:'Stock room',Shift:'Shift ledger'};
const store=new Store();
let state,tab='Register',filter='All',query='',selected='',cash='',notice='',busy=false,displayDay='';
const reg=()=>new Register(state);
function button(act,label,cls='small',data=''){return '<button class="'+cls+'" data-act="'+act+'" '+data+'>'+label+'</button>';}
const tables=(heads,rows)=>'<div class="tabular"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const opts=(values)=>values.map(([v,s])=>'<option value="'+v+'">'+s+'</option>').join('');
function msg(text){notice=text;$('#notice').textContent=text;}
function tiles(){
  const stock=reg().stock;
  const items=PRODUCTS.filter(p=>(filter==='All'||p.group===filter)&&(p.name+' '+p.id).toLowerCase().includes(query.toLowerCase()));
  return items.map(p=>{
    const lots=stock.shelf(p.id),qty=lots.reduce((v,l)=>v+l.qty,0);
    const price=lots.length?stock.price(lots[0]):p.price;
    return '<button class="tile" data-act="add" data-id="'+p.id+'" aria-label="Add '+p.name+'" '+(qty?'':'disabled')+'><img alt="" src="'+photos[p.art]+'">'+(price<p.price?'<span class="flag">TODAY −25%</span>':'')+'<span class="detail"><span class="eyebrow">'+p.id+' / '+p.group+'</span><span class="item">'+p.name+'</span><span class="meta"><b>'+yuan(price)+'</b><span>'+qty+' left</span></span></span></button>';
  }).join('')||'<p class="empty">No matching product.</p>';
}
function basket(){
  const r=reg();
  let rows='',total=0,saving=0,valid=true;
  for(const [sku,n] of Object.entries(state.basket)){
    let lines=[];
    try{lines=r.stock.allocate(sku,n);}catch(e){valid=false;}
    const sum=lines.reduce((v,l)=>v+l.qty*l.unit,0); total+=sum;
    saving+=lines.reduce((v,l)=>v+l.qty*(l.original-l.unit),0);
    rows+='<div class="cartrow"><div class="row"><b>'+product(sku).name+'</b><b>'+ (lines.length?yuan(sum):'Review qty')+'</b></div><div class="row"><small>'+(lines.map(l=>l.qty+' × '+yuan(l.unit)+' · '+l.lot).join('<br>')||'Available stock changed')+'</small><span class="step">'+button('minus','−','','data-id="'+sku+'" aria-label="Remove one '+product(sku).name+'"')+n+button('add','+','','data-id="'+sku+'" aria-label="Add one '+product(sku).name+'"')+'</span></div>'+(!lines.length?button('remove','Remove line','small','data-id="'+sku+'"'):'')+'</div>';
  }
  const parked=state.holds.map(h=>button('recall',h.id+' · '+Object.values(h.basket).reduce((a,b)=>a+b,0)+' items','small','data-id="'+h.id+'"')).join('');
  return '<aside class="till"><div class="heading"><h2>Current basket</h2>'+button('park','Park basket')+'</div>'+(rows||'<p class="empty">Select a product to start this sale.</p>')+'<div class="row sub"><span>Markdown savings</span><b>'+yuan(saving)+'</b></div><div class="row total"><span>Amount due</span><strong id="due">'+(valid?yuan(total):'—')+'</strong></div><div class="cashrow"><label>Cash received (CNY)<input id="cash" type="number" min="0" step=".01" inputmode="decimal"></label><label>Change due<br><b id="change">—</b></label></div>'+button('pay','Take cash & issue receipt','solid pay',(!rows||!valid?'disabled':''))+'<div class="park"><span class="eyebrow">Parked baskets · '+state.holds.length+'</span><div>'+(parked||'<span class="note">No tickets waiting.</span>')+'</div></div></aside>';
}
function checkout(){
  return '<div class="columns"><section class="panel"><div class="heading"><h2>On the shelf</h2><span class="eyebrow">6 products</span></div><input class="search" id="search" aria-label="Search products" placeholder="Search by item or till code"><div class="filters">'+['All','Fresh','Chilled','Drinks','Pantry'].map(f=>button('filter',f,f===filter?'chosen':'','data-id="'+f+'"')).join('')+'</div><div class="products" id="products">'+tiles()+'</div><p class="note legend">Today’s fresh and chilled batches are 25% off. The earliest expiry sells first.</p></section>'+basket()+'</div>';
}
function returns(){
  const s=state.sales.find(x=>x.id===selected);
  const recent=state.sales.slice(-8).reverse().map(x=>[button('select',x.id,'listbtn','data-id="'+x.id+'"'),x.day,yuan(x.total)]);
  let detail='<p class="empty">Look up a sale to see the paid prices and remaining quantities.</p>';
  if(s){
    const selectable=s.lines.map((l,i)=>[i,product(l.sku).name+' · '+l.lot+' · '+(l.qty-l.returned)+' left']).filter(([i])=>s.lines[i].qty>s.lines[i].returned);
    detail='<div class="heading"><h2>'+s.id+'</h2>'+button('receipt','View receipt','small','data-id="'+s.id+'"')+'</div>'+tables(['Item / lot','Paid each','Sold','Refunded','Left'],s.lines.map(l=>[product(l.sku).name+' / '+l.lot,yuan(l.unit),l.qty,l.returned,l.qty-l.returned]))+(selectable.length?'<label class="field">Receipt line<select id="line">'+opts(selectable)+'</select></label><label class="field">Quantity<input id="rq" type="number" min="1" value="1"></label><label class="field">Returned condition<select id="condition"><option>Sealed</option><option>Opened</option></select></label><p class="note">Opened goods and expired lots go to quarantine.</p>'+button('refund','Record cash refund','solid sub'):'<p class="note">This receipt has been fully refunded.</p>');
  }
  return '<div class="columns"><section class="panel">'+detail+'</section><aside class="till"><h2>Find receipt</h2><label class="field">Sale number<input id="lookup" placeholder="S0001"></label>'+button('find','Look up sale','solid')+'<h3 class="sub">Recent sales</h3>'+(recent.length?tables(['Receipt','Date','Paid'],recent):'<p class="empty">No completed sales yet.</p>')+'</aside></div>';
}
function stockView(){
  const r=reg(), low=PRODUCTS.filter(p=>r.stock.shelf(p.id).reduce((a,l)=>a+l.qty,0)<p.min);
  const rows=state.lots.map(l=>[l.id,product(l.sku).name,l.expires,l.expires<r.day?'Expired':l.qty===0?'Empty':r.stock.price(l)<product(l.sku).price?'−25% today':'Regular',l.qty,l.blocked]);
  return '<div class="columns"><section class="panel"><h2>Batch register</h2>'+tables(['Lot','Product','Expiry','Status','On hand','Isolated'],rows)+'<p class="note">Expired on-hand units are excluded from checkout availability.</p></section><aside class="till"><h2>Receive a delivery</h2><label class="field">Product<select id="sku">'+opts(PRODUCTS.map(p=>[p.id,p.name]))+'</select></label><label class="field">Units<input id="sq" type="number" min="1" value="1"></label><label class="field">Use-by date<input id="expiry" type="date" value="'+r.day+'"></label>'+button('receive','Add stock lot','solid')+'<div class="park"><h3>Below shelf minimum</h3>'+ (low.map(p=>'<p class="entry">'+p.name+' <small>· target '+p.min+'</small></p>').join('')||'<p class="note">All products meet minimum.</p>')+'</div></aside></div>';
}
function shift(){
  const r=reg(),s=r.shift(), movements=state.moves.filter(m=>m.day===r.day).slice().reverse();
  const stats=[['Completed sales',s.sales],['Sales',yuan(s.gross)],['Refunds',yuan(s.paidBack)],['Net cash',yuan(s.net)],['Markdown units sold',s.markedUnits]];
  return '<section class="panel"><div class="heading"><h2>Today’s till</h2>'+button('csv','Export ledger CSV')+'</div><div class="kpis">'+stats.map(([k,v])=>'<div class="metric"><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div><h3>Stock movements</h3>'+(movements.length?tables(['Reference','Reason','Product','Lot','Shelf Δ','Quarantine Δ'],movements.map(m=>[m.ref,m.reason,product(m.sku).name,m.lot,m.delta,m.isolated])):'<p class="empty">Sales, returns and deliveries will appear here.</p>')+'</section>';
}
function render(){
  displayDay=dayOf();
  $('nav').innerHTML=Object.keys(sections).map(k=>button('nav',k,k===tab?'active':'','data-id="'+k+'"')).join('');
  $('#title').textContent=sections[tab]; $('#section-id').textContent='CAMPUS MARKET / '+tab;
  $('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  $('#app').innerHTML=({Register:checkout,Returns:returns,Stock:stockView,Shift:shift})[tab]();
  if(tab==='Register'){$('#search').value=query;$('#cash').value=cash;showChange();}
}
function toFen(value){
  if(!/^\d+(?:\.\d{1,2})?$/.test(value)) throw Error('Enter cash as yuan with up to two decimal places.');
  const [units,part='']=value.split('.'); return Number(units)*100+Number(part.padEnd(2,'0'));
}
function showChange(){let v='—';try{const delta=toFen(cash)-reg().quote().total;if(delta>=0 && Object.keys(state.basket).length)v=yuan(delta);}catch{} $('#change').textContent=v;}
function paper(x){
  const sale='lines' in x;
  $('#paper').innerHTML='<div class="eyebrow">Noon Counter · Till 01</div><h2>'+(sale?'Sale receipt':'Refund receipt')+'</h2><p class="note">'+x.id+' / '+x.day+'</p>'+(sale?tables(['Item / batch','Qty','Each','Line'],x.lines.map(l=>[product(l.sku).name+' / '+l.lot,l.qty,yuan(l.unit),yuan(l.unit*l.qty)]))+'<div class="row"><span>Cash / change</span><b>'+yuan(x.cash)+' / '+yuan(x.change)+'</b></div>':'<p class="entry">Original sale '+x.sale+' · '+product(x.sku).name+' × '+x.qty+'</p><p>'+x.lot+' / '+x.condition+' / '+x.route+'</p>')+'<div class="row total"><span>'+(sale?'Total paid':'Cash refunded')+'</span><strong>'+yuan(sale?x.total:x.amount)+'</strong></div>';
  $('#dialog').showModal();
}
function csv(){
  const r=reg(),s=r.shift(),rows=[['Day','Sales (CNY)','Refunds (CNY)','Net cash (CNY)'],[r.day,s.gross/100,s.paidBack/100,s.net/100],[],['Ref','Reason','Lot','Product','Shelf delta','Isolated delta'],...state.moves.filter(m=>m.day===r.day).map(m=>[m.ref,m.reason,m.lot,product(m.sku).name,m.delta,m.isolated])];
  const url=URL.createObjectURL(new Blob([rows.map(row=>row.join(',')).join('\r\n')],{type:'text/csv'}));
  const link=document.createElement('a');link.href=url;link.download='Noon-ledger-'+r.day+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function act(a,id){
  if(a==='close'){ $('#dialog').close();return; }
  if(a==='print'){window.print();return;}
  msg('');
  if(a==='nav'){tab=id;render();return;}
  if(a==='filter'){filter=id;render();return;}
  if(a==='receipt'){paper(state.sales.find(s=>s.id===id));return;}
  if(a==='csv'){csv();return;}
  if(a==='find'||a==='select'){
    const key=a==='find'?$('#lookup').value.trim().toUpperCase():id;
    if(!state.sales.some(s=>s.id===key)){selected='';render();throw Error('Receipt not found. Check the sale number.');}
    selected=key;render();return;
  }
  if(a==='pay' && displayDay!==dayOf()){render();throw Error('The business date changed. Review prices before collecting cash.');}
  const ops={
    add:r=>r.setQty(id,(r.s.basket[id]||0)+1),
    minus:r=>r.setQty(id,(r.s.basket[id]||0)-1),remove:r=>r.setQty(id,0),
    park:r=>r.park(),recall:r=>r.recall(id),pay:r=>r.pay(toFen(cash)),
    refund:r=>r.refund(selected,Number($('#line').value),Number($('#rq').value),$('#condition').value),
    receive:r=>r.receive($('#sku').value,Number($('#sq').value),$('#expiry').value)
  };
  const out=await store.run(ops[a],state.version); state=out.state;
  if(['park','recall','pay'].includes(a))cash='';
  render();
  if(a==='pay'||a==='refund')paper(out.result);
  if(a==='park')msg('Parked as '+out.result+'. Stock will be checked again at payment.');
  if(a==='recall'){
    try{
      const now=reg().quote().total;
      msg('Recalled '+id+'. '+(now===out.result?'Total unchanged at '+yuan(now)+'.':
        'Price changed from '+yuan(out.result)+' to '+yuan(now)+'. Available batches changed.'));
    }catch{msg('Recalled '+id+'. Stock changed. Reduce or remove the unavailable line.');}
  }
  if(a==='receive')msg('Delivery recorded as '+out.result+'.');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||busy||b.disabled)return;busy=true;
  try{await act(b.dataset.act,b.dataset.id);}
  catch(e){if(e.message.includes('another tab')){state=(await store.run()).state;render();}msg(e.message);}
  finally{busy=false;}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#products').innerHTML=tiles();}
  if(e.target.id==='cash'){cash=e.target.value;showChange();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lookup')$('[data-act=find]').click();});
store.open().then(o=>{state=o.state;render();}).catch(()=>msg('Browser storage could not open. Use a regular Chrome, Edge or Firefox window.'));
</script></body></html>
